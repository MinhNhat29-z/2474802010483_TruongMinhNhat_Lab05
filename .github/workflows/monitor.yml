name: GoRest API Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install --global newman

      - name: Validate Collection JSON
        run: node -e "JSON.parse(require('fs').readFileSync('Collection.json', 'utf8')); console.log('Collection.json is valid JSON')"

      - name: Validate Environment JSON
        run: node -e "JSON.parse(require('fs').readFileSync('Environment.json', 'utf8')); console.log('Environment.json is valid JSON')"

      - name: Run Postman API tests
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          if [ -z "$GOREST_TOKEN" ]; then
            echo "Missing GitHub Actions secret: GOREST_TOKEN"
            exit 1
          fi

          newman run Collection.json \
            --environment Environment.json \
            --env-var "token=$GOREST_TOKEN" \
            --reporters cli
